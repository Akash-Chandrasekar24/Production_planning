<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>How it works</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1830;--card:#16223f;--card2:#1c2a4d;--line:rgba(255,255,255,.12);--text:#eef1f8;--muted:#a3aec8;--purple:#a684ee;--orange:#f58a3a;--blue:#5b8def;--teal:#2bb3a3;--neon:#34d59a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Montserrat,system-ui,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding:16px 18px 10px;overflow:auto}
.title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.title b{font-size:16px}
.title small{font-size:12px;color:var(--muted)}

/* the flow: a row of steps on wide screens, a column in narrow frames */
.flow{display:flex;align-items:stretch;list-style:none;margin:0;padding:0}
.step{flex:1;min-width:0;display:flex;align-items:center}
.box{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;cursor:pointer;
  font:inherit;color:inherit;background:var(--card);border:2px solid var(--c);border-radius:16px;padding:14px;transition:transform .15s ease,box-shadow .15s ease}
.box:hover,.box[aria-pressed=true]{transform:translateY(-2px);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.box:focus-visible,.db:focus-visible{outline:2px solid #fff;outline-offset:3px}
.num{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.06em}
.ic{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.box h2{margin:0;font-size:16px;line-height:1.25}
.box p{margin:0;font-size:13px;line-height:1.45;color:var(--muted)}
.box .sub{display:none;font-size:12px;color:var(--muted);margin-top:2px}
.ai .box{background:linear-gradient(160deg,#2a1d4f,#16223f 70%);box-shadow:0 0 30px rgba(166,132,238,.25)}
.arrow{flex:none;width:38px;align-self:center;height:2px;position:relative;background:rgba(255,255,255,.3)}
.arrow:after{content:"";position:absolute;right:-1px;top:-5px;border:6px solid transparent;border-left-color:rgba(255,255,255,.5);border-right:0}
.arrow i{position:absolute;top:-3px;left:0;width:8px;height:8px;border-radius:50%;background:var(--orange);animation:go 1.8s linear infinite}
@keyframes go{from{left:0}to{left:calc(100% - 8px)}}

/* re-plan loop and the shared database */
.loop{display:flex;justify-content:center}
.loop span{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--orange);border:1px dashed rgba(245,138,58,.6);border-radius:999px;padding:5px 12px;text-align:center}
.db{--c:var(--neon);display:flex;align-items:center;gap:12px;cursor:pointer;font:inherit;color:inherit;text-align:left;width:100%;border:2px solid var(--neon);border-radius:14px;padding:10px 14px;
  background:linear-gradient(90deg,rgba(52,213,154,.14),rgba(52,213,154,.04));box-shadow:0 0 24px rgba(52,213,154,.15)}
.db[aria-pressed=true]{box-shadow:0 0 0 4px rgba(52,213,154,.3)}
.db b{font-size:14px}.db small{display:block;font-size:12px;color:var(--muted)}
.db .taps{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.db .taps span{font-size:12px;color:var(--neon);border:1px solid rgba(52,213,154,.4);border-radius:999px;padding:2px 8px}

/* details for the chosen step */
.detail{display:none;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5}
.detail.show{display:block}
.detail h3{margin:0 0 6px;font-size:14px}
.detail ul{margin:0;padding-left:18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 18px}
.detail .x{float:right;background:none;border:0;color:var(--muted);font-size:16px;cursor:pointer}
.foot{font-size:12px;color:var(--muted);padding:0 18px 10px}

/* narrow frame (the Overview card): the same flow, top to bottom */
body.narrow main{padding:12px;gap:10px}
body.narrow .flow{flex-direction:column}
body.narrow .step{flex-direction:column;align-items:stretch}
body.narrow .box{flex-direction:row;align-items:center;padding:10px 12px;gap:10px}
body.narrow .box p,body.narrow .num{display:none}
body.narrow .box h2{font-size:14px}
body.narrow .box .sub{display:block}
body.narrow .arrow{width:2px;height:16px;background:rgba(255,255,255,.3)}
body.narrow .arrow:after{right:-5px;top:auto;bottom:-1px;border:6px solid transparent;border-top-color:rgba(255,255,255,.5);border-bottom:0}
body.narrow .arrow i{left:-3px;top:0;animation-name:down}
@keyframes down{from{top:0}to{top:calc(100% - 8px)}}
body.narrow .db .taps,body.narrow .title small,body.narrow .foot{display:none}
body.narrow .detail ul{grid-template-columns:1fr}
.box .side-ic{display:none}
body.narrow .box .side-ic{display:grid}
@media (prefers-reduced-motion:reduce){.arrow i{display:none}.box{transition:none}}
</style></head>
<body>
<main>
  <div class="title"><b>How the app works</b><small>Follow the arrows · select a step to see what happens there</small></div>
  <ol class="flow" id="flow"></ol>
  <div class="loop"><span>↺ Not happy with the plan? Ask for a change and the AI agent plans again</span></div>
  <button class="db" data-step="db" aria-pressed="false">
    <span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg></span>
    <span><b>Neon database</b><small>Every step saves its work here and reads from it, so everyone sees the same numbers</small></span>
    <span class="taps"><span>Orders</span><span>Stock</span><span>Machines</span><span>Crews</span><span>Plans</span><span>Approvals</span></span>
  </button>
  <section class="detail" id="detail" aria-live="polite"></section>
</main>
<div class="foot" id="foot"></div>
<script>
const DATA = /*DATA*/null;
const I = {
  in: '<path d="M12 16V5M7 10l5-5 5 5M5 20h14"/>',
  ai: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/>',
  ok: '<path d="M16 20v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM16 11l2 2 4-4"/>',
  out: '<path d="M4 12l16-8-6 16-2-7-8-1z"/>',
  see: '<path d="M5 19V10M10 19V5M15 19v-7M20 19V8"/>',
};
const STEPS = [
  {id: "in", c: "var(--blue)", t: "Orders and data come in", s: "Uploads, ERP and the shop floor",
   p: "Purchase orders are uploaded, and data arrives from the ERP, other databases and the shop floor.",
   d: ["Purchase-order sheets uploaded on Connections", "Orders, bills of materials and stock from the ERP and databases", "Machine output, stops and crews from the shop floor", "Each new upload is checked before anything else happens"]},
  {id: "ai", c: "var(--purple)", t: "AI agent", s: "Checks, forecasts and plans", cls: "ai",
   p: "Checks the new orders, materials, machines and crews, forecasts demand and builds a plan the plants can run.",
   d: ["Checks every new order and flags problems", "Compares materials with the plan and safety stock, and suggests what to buy", "Watches machines and crews and raises problems", "Forecasts the coming weeks", "Builds the plan: right product, quantity and order, with fewer changeovers", "Explains every change in plain words"]},
  {id: "ok", c: "var(--orange)", t: "People review and approve", s: "Production manager, then each plant",
   p: "Nothing goes out on its own. The production manager approves, then each plant's production head approves for their plant.",
   d: ["The production manager reviews the plan and its risks", "Each plant's production head approves it for their plant", "A plan with every approval is marked fully approved", "Anyone can ask for a change; the AI agent plans again"]},
  {id: "out", c: "var(--teal)", t: "The plan goes out", s: "Emailed to the team",
   p: "The approved plan is emailed to the people concerned, with the full detail attached, and the plants work from it.",
   d: ["Email to the production manager, planners and the plant heads concerned", "A short summary, with every job in an attached sheet", "Tasks and alerts in each person's notifications"]},
  {id: "see", c: "var(--neon)", t: "See and ask", s: "Dashboards, the plant, the assistant",
   p: "Everyone follows progress on the dashboards and the digital twin, and can ask the planning assistant questions.",
   d: ["Overview and dashboard with the success measures", "The plan, its timeline and which order is made first", "The digital twin: every line, machine and warehouse", "Ask the planning assistant questions in plain words"]},
];
const DB = {c: "var(--neon)", t: "Neon database", p: "", d: ["Orders, stock, machines, crews and shipments", "Every plan, approval and change, with who did what", "Uploads, tasks and notifications", "One shared copy: no step keeps its own"]};

const svg = id => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[id]}</svg>`;
const flow = document.getElementById("flow"), detail = document.getElementById("detail");
STEPS.forEach((s, i) => {
  const li = document.createElement("li"); li.className = "step " + (s.cls || "");
  li.innerHTML = `${i ? `<span class="arrow" aria-hidden="true"><i style="animation-delay:${i * .35}s"></i></span>` : ""}
    <button class="box" style="--c:${s.c}" data-step="${s.id}" aria-pressed="false">
      <span class="num"><span class="ic">${svg(s.id)}</span>Step ${i + 1}</span>
      <span class="ic side-ic">${svg(s.id)}</span>
      <span><h2>${s.t}</h2><span class="sub">${s.s}</span></span><p>${s.p}</p></button>`;
  flow.appendChild(li);
});
const layout = () => document.body.classList.toggle("narrow", innerWidth < 760);
layout(); addEventListener("resize", layout);

function show(id) {
  document.querySelectorAll("[data-step]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.step === id)));
  const s = id === "db" ? DB : STEPS.find(x => x.id === id);
  if (!s) { detail.classList.remove("show"); return; }
  detail.innerHTML = `<button class="x" aria-label="Close" data-close>✕</button><h3 style="color:${s.c}">${s.t}</h3>
    ${s.p ? `<p style="margin:0 0 8px">${s.p}</p>` : ""}<ul>${s.d.map(x => `<li>${x}</li>`).join("")}</ul>`;
  detail.classList.add("show");
  detail.scrollIntoView({block: "nearest", behavior: "smooth"});
}
document.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) return show(null);
  const b = e.target.closest("[data-step]");
  if (b) show(b.getAttribute("aria-pressed") === "true" ? null : b.dataset.step);
});
addEventListener("keydown", e => { if (e.key === "Escape") show(null); });
if (DATA) document.getElementById("foot").textContent = `Checked against graphify's map of the app's code: ${DATA.source.graph_nodes.toLocaleString()} parts and ${DATA.source.graph_links.toLocaleString()} links.`;
</script>
</body></html>
